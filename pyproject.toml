[project]
name = "nfl-data-sheet"
version = "0.1.0"
description = "Free-to-run NFL analytics pipeline: collectors, analysts, synthesizer, data sheet."
requires-python = ">=3.12"
dependencies = [
    "polars>=1.9",
    "nflreadpy>=0.1",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "nflreadpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
