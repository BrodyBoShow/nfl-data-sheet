name: dispatcher

"on":
  schedule:
    # Every ~10 min, never on :00 (CLAUDE.md convention). Phase 1 skeleton: this always
    # runs every registered collector/analyst; each one's own should_run()/inputs_ready()
    # decides whether there's anything to do. Full calendar-aware triggering is Phase 8.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run dispatcher
        id: dispatcher
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python -m pipeline.orchestration.dispatcher

      - name: File an issue on auditor failure
        if: steps.dispatcher.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Dispatcher run flagged unhealthy ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --body "The dispatcher's auditor check failed. See the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
