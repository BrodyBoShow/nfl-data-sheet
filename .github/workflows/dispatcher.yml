name: dispatcher

"on":
  schedule:
    # Every ~15 min at odd offsets, never on :00 (CLAUDE.md convention). GitHub Actions'
    # free-tier scheduled triggers are best-effort on shared runners, not a guarantee --
    # observed live: over ~3 hours at a 10-min cron, only 1 scheduled run actually fired.
    # A tighter cron doesn't fix that; it just queues more requests GitHub is equally
    # free to drop. The dispatcher and every collector/analyst's should_run()/
    # inputs_ready() are built to tolerate this already -- they decide what's due from
    # stored freshness state (source_freshness markers, agent_runs.finished_at) compared
    # against the live/current value or absolute now, never from how much time or how
    # many ticks have passed since the last run. Never make that assumption here either.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run dispatcher
        id: dispatcher
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python -m pipeline.orchestration.dispatcher

      - name: File an issue on auditor failure
        if: steps.dispatcher.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Dispatcher run flagged unhealthy ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --body "The dispatcher's auditor check failed. See the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
