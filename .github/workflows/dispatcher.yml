name: dispatcher

"on":
  schedule:
    # Every ~15 min at odd offsets, never on :00 (CLAUDE.md convention). GitHub Actions'
    # free-tier scheduled triggers are best-effort on shared runners, not a guarantee --
    # observed live: over ~3 hours at a 10-min cron, only 1 scheduled run actually fired.
    # A tighter cron doesn't fix that; it just queues more requests GitHub is equally
    # free to drop. The dispatcher and every collector/analyst's should_run()/
    # inputs_ready() are built to tolerate this already -- they decide what's due from
    # stored freshness state (source_freshness markers, agent_runs.finished_at) compared
    # against the live/current value or absolute now, never from how much time or how
    # many ticks have passed since the last run. Never make that assumption here either.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run dispatcher
        id: dispatcher
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run python -m pipeline.orchestration.dispatcher

      # Runs on either signal, which the dispatcher step keeps distinct on purpose (see
      # pipeline/orchestration/dispatcher.py/auditor.py): a hard failure (a collector or
      # analyst actually raised) fails the step outright, while an auditor alert (a
      # stale table, a missed odds target) is reported via the `alerted` step output
      # without failing the step -- so a persistent-but-known warning doesn't paint
      # every run red. `if:` needs failure() explicitly for the first branch: GitHub
      # skips every later step after a failure unless the step's own `if:` says
      # otherwise.
      - name: File an issue on dispatcher failure or auditor alert
        if: (failure() && steps.dispatcher.outcome == 'failure') || steps.dispatcher.outputs.alerted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.dispatcher.outcome }}" = "failure" ]; then
            title="Dispatcher run failed ($(date -u +%Y-%m-%dT%H:%MZ))"
            body="A collector or analyst run failed. See the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            title="Auditor alert ($(date -u +%Y-%m-%dT%H:%MZ))"
            body="The auditor flagged a new issue (see Discord/logs for the message). Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          gh issue create --title "$title" --body "$body"
